name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      # Leakage guards are not optional. If a detector can see the gold patch,
      # every number in results/ is meaningless and CI must fail.
      - run: python3 -m pytest tests/ -q
      - run: python3 scripts/analyze.py
      # T6 falsification check (TASKS.md T6, decision 2): only on pushes to
      # main, where results/shards/*.jsonl can legitimately change. A PR
      # hasn't regenerated shards, so there's nothing new to check per-PR,
      # and running this there would rewrite README.md from someone else's
      # PR branch.
      - if: github.ref == 'refs/heads/main'
        run: python3 scripts/check_gate_precision.py
